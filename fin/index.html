<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Sample responsive website for web design project" />
  <title>My Responsive Site</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <!-- Navigation Bar -->
  <header>
    <nav class="navbar">
      <h1>My Portfolio</h1>
      <ul>
        <li><a href="#home">Home</a></li>
        <li><a href="#about">About</a></li>
        <li><a href="#gallery">Gallery</a></li>
        <li><a href="#contact">Contact</a></li>
      </ul>
    </nav>
  </header>

  <!-- Hero Section -->
  <section id="home" class="hero">
    <h2>Welcome to My Creative Space</h2>
    <p>Explore my work, ideas, and inspirations.</p>
    <button onclick="showMessage()">Click Me</button>
  </section>

  <!-- About Section -->
  <section id="about" class="content">
    <h2>About Me</h2>
    <p>I’m a web design student learning how to make beautiful and accessible websites.</p>
  </section>

  <!-- Gallery with Carousel -->
  <section id="gallery" class="gallery">
    <h2>Image Carousel</h2>
    <div class="carousel">
      <img id="carouselImage" src="https://picsum.photos/600/300?random=1" alt="Sample image" />
      <div class="carousel-buttons">
        <button onclick="prevImage()">⟨</button>
        <button onclick="nextImage()">⟩</button>
      </div>
    </div>
  </section>

  <!-- Plugin Example (Google Map) -->
  <section id="map" class="content">
    <h2>Find Me</h2>
    <iframe
      title="Google Map"
      src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3153.019808937543!2d144.95605431531807!3d-37.816279379751734!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x0%3A0x0!2zMzfCsDQ5JzAwLjYiUyAxNDTCsDU3JzI0LjEiRQ!5e0!3m2!1sen!2sin!4v1600000000000!5m2!1sen!2sin"
      width="100%"
      height="250"
      style="border:0;"
      allowfullscreen=""
      loading="lazy">
    </iframe>
  </section>

  <!-- Contact Form -->
  <section id="contact" class="content">
    <h2>Contact Me</h2>
    <form aria-label="Contact Form">
      <label for="name">Name:</label>
      <input type="text" id="name" required />

      <label for="email">Email:</label>
      <input type="email" id="email" required />

      <label for="message">Message:</label>
      <textarea id="message" required></textarea>

      <button type="submit">Send</button>
    </form>
  </section>

  <!-- Sticky Footer -->
  <footer>
    <p>&copy; 2025 My Portfolio | Designed by Me</p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
